name: Synthetic CLI (linux)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner used for this manually dispatched simulation
        type: choice
        options: [hosted, session]
        default: hosted
      game:
        description: Controlled fixture game target (no real game/mod assets)
        type: choice
        options: [both, KOTOR1, KOTOR2]
        default: both

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ${{ inputs.runner == 'session' && fromJSON('["self-hosted", "Linux", "modsync-session"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout immutable source guide corpus
        uses: actions/checkout@v4
        with:
          repository: kolto-labs/mod-builds
          ref: 21b2f0499d28ecd4ee2092701dee5792ba5da4b9
          path: corpus
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        if: inputs.runner != 'session'
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        if: inputs.runner != 'session'
        with:
          node-version: 22
          cache: pnpm
      - name: Use the session Node runtime and pinned Corepack pnpm shim
        if: inputs.runner == 'session'
        run: |
          corepack_shim_dir="$RUNNER_TEMP/modsync-corepack"
          mkdir -p "$corepack_shim_dir"
          corepack enable --install-directory "$corepack_shim_dir" pnpm
          echo "$corepack_shim_dir" >> "$GITHUB_PATH"
          node --version
          corepack pnpm --version
      - name: Install dependencies
        env:
          ELECTRON_GET_USE_PROXY: ${{ inputs.runner == 'session' && '1' || '' }}
        run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build
      - name: Audit guides and run controlled CLI fixtures
        run: corepack pnpm exec tsx tools/synthetic-modbuild.ts --corpus corpus --output artifacts/synthetic-cli --game "${{ inputs.game }}"
      - name: Upload audit, CLI logs, output proofs and checkpoints
        if: always() && inputs.runner != 'session'
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-cli-linux
          path: artifacts/synthetic-cli
          if-no-files-found: error
      - name: Retain session evidence in the provisioned runner workspace
        if: always() && inputs.runner == 'session'
        shell: bash
        run: |
          test -d artifacts
          echo "Session proof remains in $GITHUB_WORKSPACE/artifacts (artifact storage is unavailable from this environment)."
